<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Flow collaboration cycle</title>
  <desc id="desc">A diagram showing a feature branch created from main, pushed to GitHub, reviewed through a pull request, merged, and synchronized back to the local repository.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="620" fill="#F8FAFC"/>
  <text x="600" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">GitHub Flow</text>
  <text x="600" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">A short-lived branch carries one change from development to review and integration.</text>
  <line x1="140" y1="208" x2="1060" y2="208" stroke="#CBD5E1" stroke-width="3"/><line x1="140" y1="390" x2="1060" y2="390" stroke="#CBD5E1" stroke-width="3"/>
  <text x="78" y="213" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">LOCAL</text><text x="70" y="395" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">REMOTE</text>
  <g><circle cx="180" cy="208" r="17" fill="#2563EB"/><circle cx="180" cy="208" r="6" fill="#FFFFFF"/><text x="180" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1D4ED8">main</text><text x="180" y="250" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">stable base</text></g>
  <g><circle cx="390" cy="208" r="17" fill="#0F766E"/><circle cx="390" cy="208" r="6" fill="#FFFFFF"/><text x="390" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">feature/login</text><text x="390" y="250" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">local commits</text></g>
  <g><circle cx="600" cy="390" r="17" fill="#7C3AED"/><circle cx="600" cy="390" r="6" fill="#FFFFFF"/><text x="600" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#6D28D9">Pull Request</text><text x="600" y="480" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">review + CI</text></g>
  <g><circle cx="850" cy="390" r="17" fill="#2563EB"/><circle cx="850" cy="390" r="6" fill="#FFFFFF"/><text x="850" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1D4ED8">main</text><text x="850" y="480" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">merged change</text></g>
  <g><circle cx="1040" cy="208" r="17" fill="#0F766E"/><circle cx="1040" cy="208" r="6" fill="#FFFFFF"/><text x="1040" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">local main</text><text x="1040" y="250" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">pull latest state</text></g>
  <path d="M205 208H365" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="285" y="185" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">checkout -b</text>
  <path d="M407 208C500 208 520 300 590 368" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="482" y="258" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">push</text>
  <path d="M617 390H825" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="367" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">merge after approval</text>
  <path d="M868 390C930 350 980 270 1028 226" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="963" y="320" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">git pull</text>
  <rect x="220" y="540" width="760" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="600" y="563" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">Keep main stable. Isolate each change. Review before integration. Synchronize after merge.</text>
</svg>
