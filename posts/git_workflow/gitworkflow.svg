<svg width="1080" height="520" viewBox="0 0 1080 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Git workspace flow</title>
  <desc id="desc">A diagram showing changes moving from workspace to git workspace and then to commit through git add and git commit commands.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="520" rx="24" fill="#f8fafc"/>

  <text x="540" y="48" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#111827">Workspace -> Git Workspace -> Commit</text>
  <text x="540" y="78" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#475569">每条命令都把一个“文件状态快照”推进到下一个区域</text>

  <g filter="url(#shadow)">
    <rect x="70" y="132" width="260" height="238" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="70" y="132" width="260" height="58" rx="18" fill="#e0f2fe"/>
    <path d="M70 172H330" stroke="#bae6fd" stroke-width="2"/>
    <text x="200" y="168" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#075985">Workspace</text>
    <text x="200" y="214" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#334155">Working Directory</text>
    <text x="200" y="245" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#475569">你正在编辑的文件</text>
    <text x="200" y="273" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">modified / untracked / deleted</text>
    <rect x="112" y="308" width="176" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="200" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#334155">git status / diff</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="132" width="260" height="238" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="410" y="132" width="260" height="58" rx="18" fill="#dcfce7"/>
    <path d="M410 172H670" stroke="#bbf7d0" stroke-width="2"/>
    <text x="540" y="168" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#166534">Git Workspace</text>
    <text x="540" y="214" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#334155">Staging Area / Index</text>
    <text x="540" y="245" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#475569">下一次 commit 的候选快照</text>
    <text x="540" y="273" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">只包含被 add 的文件状态</text>
    <rect x="458" y="308" width="164" height="34" rx="17" fill="#f0fdf4" stroke="#86efac"/>
    <text x="540" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#166534">git diff --staged</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="132" width="260" height="238" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <rect x="750" y="132" width="260" height="58" rx="18" fill="#fee2e2"/>
    <path d="M750 172H1010" stroke="#fecaca" stroke-width="2"/>
    <text x="880" y="168" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#991b1b">Commit</text>
    <text x="880" y="214" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#334155">Repository History</text>
    <text x="880" y="245" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#475569">被保存下来的代码版本</text>
    <text x="880" y="273" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">immutable snapshot + commit id</text>
    <rect x="799" y="308" width="162" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="880" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#991b1b">git log / show</text>
  </g>

  <path d="M340 237H398" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="339" y="196" width="72" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="375" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#111827">git add</text>

  <path d="M680 237H738" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="669" y="196" width="92" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="715" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#111827">git commit</text>

  <path d="M468 388C420 430 288 430 240 388" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <text x="354" y="454" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#475569">git restore --staged</text>
  <text x="354" y="477" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#64748b">取消暂存：改动仍然留在 workspace</text>

  <path d="M826 388C734 480 326 480 214 388" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <text x="626" y="454" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#475569">git restore &lt;file&gt;</text>
  <text x="626" y="477" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#64748b">从历史版本恢复文件状态</text>
</svg>
