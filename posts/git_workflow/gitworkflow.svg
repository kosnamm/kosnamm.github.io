<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Git object lifecycle</title>
  <desc id="desc">A diagram showing changes moving from the working directory to the staging area and then into repository history.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="600" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Git Object Lifecycle</text>
  <text x="600" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Changes are selected, inspected, and recorded as immutable snapshots.</text>

  <g>
    <rect x="70" y="138" width="300" height="250" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="70" y="138" width="300" height="8" fill="#2563EB"/>
    <text x="100" y="188" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D4ED8">Working Directory</text>
    <text x="100" y="222" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">Files being edited locally</text><line x1="100" y1="246" x2="340" y2="246" stroke="#E2E8F0"/>
    <text x="100" y="278" font-family="monospace" font-size="14" fill="#475569">modified</text><text x="100" y="304" font-family="monospace" font-size="14" fill="#475569">untracked</text><text x="100" y="330" font-family="monospace" font-size="14" fill="#475569">deleted</text>
    <rect x="100" y="350" width="138" height="28" fill="#EFF6FF" stroke="#BFDBFE"/><text x="169" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#1E40AF">git status</text>
  </g>
  <g>
    <rect x="450" y="138" width="300" height="250" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="450" y="138" width="300" height="8" fill="#0F766E"/>
    <text x="480" y="188" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#0F766E">Staging Area</text>
    <text x="480" y="222" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">The next commit candidate</text><line x1="480" y1="246" x2="720" y2="246" stroke="#E2E8F0"/>
    <text x="480" y="278" font-family="monospace" font-size="14" fill="#475569">selected file states</text><text x="480" y="304" font-family="monospace" font-size="14" fill="#475569">review before commit</text>
    <rect x="480" y="350" width="174" height="28" fill="#F0FDFA" stroke="#99F6E4"/><text x="567" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#115E59">git diff --staged</text>
  </g>
  <g>
    <rect x="830" y="138" width="300" height="250" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="830" y="138" width="300" height="8" fill="#7C3AED"/>
    <text x="860" y="188" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#6D28D9">Repository History</text>
    <text x="860" y="222" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">Immutable project snapshots</text><line x1="860" y1="246" x2="1100" y2="246" stroke="#E2E8F0"/>
    <text x="860" y="278" font-family="monospace" font-size="14" fill="#475569">commit object</text><text x="860" y="304" font-family="monospace" font-size="14" fill="#475569">commit id + message</text>
    <rect x="860" y="350" width="128" height="28" fill="#F5F3FF" stroke="#DDD6FE"/><text x="924" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#5B21B6">git log</text>
  </g>
  <path d="M380 263H438" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="409" y="239" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">git add</text>
  <path d="M760 263H818" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="789" y="239" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">git commit</text>
  <path d="M600 420C530 490 270 490 200 420" stroke="#64748B" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#muted)"/>
  <text x="400" y="490" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">git restore --staged</text><text x="400" y="513" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">Unstage without discarding local changes</text>
</svg>
